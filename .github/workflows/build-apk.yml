

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q SmartSchedule-project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        id: gradle
        run: |
          WRAPPER="$(find project -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle wrapper not found in ZIP"
            exit 1
          fi
          echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"
          chmod +x "$WRAPPER"

      - name: Build APK
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartSchedule-debug-apk
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
